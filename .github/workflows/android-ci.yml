name: Android CI & APK Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests (GCash Parser & Smart Quick-Add)
        run: gradle testDebugUnitTest

      - name: Assemble Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PesoFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Latest APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: "PesoFlow Android APK (Latest Build)"
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
