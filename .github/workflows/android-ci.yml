name: Android CI & APK Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests (GCash Parser & Smart Quick-Add)
        run: gradle testDebugUnitTest

      - name: Assemble Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PesoFlow-v1.0.1-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release v1.0.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "PesoFlow v1.0.1 — Minimalist Obsidian & Sage UI + Initial GCash Setup"
          body: |
            ### What's New in v1.0.1
            - **First-Launch GCash Balance Setup (`OnboardingScreen`)**: Starts fresh and prompts you for your actual starting GCash balance (plus optional Cash & Bank balances).
            - **Minimalist Obsidian Black & Sage Green Design**: Refined dark matte surface cards, subtle 1dp borders, clean typography, and thin progress bars.
            - **Custom Vector Logo & Adaptive Launcher Icon**: Geometric Peso + Sage ring icon (`ic_launcher`) and in-app brand header.
            - **Interactive Management**: Tap your GCash balance anytime to edit it, create custom Envelopes, add Recurring Bills, and create Sinking Fund Goals.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
